<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#FF3CAC" />
    </linearGradient>
    <linearGradient id="smGradSubtle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3867FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Futuristic Octagonal Frame -->
  <polygon points="60,6 108,26 114,74 76,112 44,112 6,74 12,26" 
           fill="#080B18" 
           stroke="url(#smGrad)" 
           stroke-width="3" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Cyber Tech Grid Lines -->
  <path d="M26,38 L40,24 M94,38 L80,24 M26,82 L40,96 M94,82 L80,96" 
        stroke="#00E5FF" 
        stroke-opacity="0.3" 
        stroke-width="1.5" />

  <!-- Monogram S and M Geometric Paths -->
  <!-- Left Wing / S Form -->
  <path d="M48,34 L28,34 L28,52 L48,58 L48,78 L26,78 M26,42 L36,42 M38,70 L48,70" 
        fill="none" 
        stroke="url(#smGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Wing / M Form connecting seamlessly -->
  <path d="M56,78 L56,34 L72,58 L88,34 L88,78" 
        fill="none" 
        stroke="url(#smGradSubtle)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Core Accent Nodes -->
  <circle cx="28" cy="34" r="2.5" fill="#00E5FF" />
  <circle cx="48" cy="78" r="2.5" fill="#FF3CAC" />
  <circle cx="72" cy="58" r="3" fill="#00E5FF" />
  <circle cx="56" cy="34" r="2.5" fill="#8B5CF6" />
  <circle cx="88" cy="34" r="2.5" fill="#00E5FF" />
</svg>
